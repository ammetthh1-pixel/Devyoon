<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mon tableau de bord — DevYoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/config.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/progress.js"></script>

<style>
.dash-main { max-width: 1000px; margin: 0 auto; padding: 130px clamp(16px,5vw,40px) 80px; }
.dash-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 40px; flex-wrap: wrap; gap: 16px; }
.dash-welcome { font-family: var(--display); font-size: 1.6rem; font-weight: 700; }
.dash-email { font-size: .82rem; color: var(--muted); margin-top: 4px; font-family: var(--mono); }
.btn-logout { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 9px 18px; border-radius: var(--radius); font-size: .82rem; font-family: var(--display); font-weight: 600; cursor: pointer; transition: color .2s, border-color .2s; }
.btn-logout:hover { color: var(--text); border-color: var(--muted); }

.track-progress-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 44px; }
.tp-card { background: var(--ink2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.8rem; }
.tp-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.tp-name { font-family: var(--display); font-size: 1.1rem; font-weight: 700; }
.tp-card.web .tp-name { color: var(--orange); }
.tp-card.ia .tp-name { color: var(--violet); }
.tp-count { font-family: var(--mono); font-size: .78rem; color: var(--muted); }
.tp-bar { height: 8px; background: var(--border); border-radius: 100px; overflow: hidden; margin-bottom: 18px; }
.tp-fill { height: 100%; border-radius: 100px; transition: width .8s cubic-bezier(.34,1.56,.64,1); }
.tp-card.web .tp-fill { background: linear-gradient(90deg, var(--orange), #FF9A6C); }
.tp-card.ia .tp-fill { background: linear-gradient(90deg, var(--violet), #A78BFA); }
.tp-phases { display: flex; flex-wrap: wrap; gap: 8px; }
.tp-phase-chip {
  width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: .74rem; font-weight: 600; border: 1px solid var(--border); color: var(--muted2);
}
.tp-phase-chip.done { color: var(--ink); font-weight: 700; }
.tp-card.web .tp-phase-chip.done { background: var(--orange); border-color: var(--orange); }
.tp-card.ia .tp-phase-chip.done { background: var(--violet); border-color: var(--violet); color: var(--text); }
.tp-link { display: inline-flex; align-items: center; gap: 6px; margin-top: 18px; font-family: var(--display); font-size: .8rem; font-weight: 700; }
.tp-card.web .tp-link { color: var(--orange); }
.tp-card.ia .tp-link { color: var(--violet); }

.badges-title { font-family: var(--display); font-size: 1.1rem; font-weight: 700; margin-bottom: 18px; }
.badges-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
.badge-card {
  background: var(--ink2); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.1rem;
  display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; opacity: .4;
}
.badge-card.earned { opacity: 1; border-color: rgba(0,200,150,.3); background: var(--green-dim); }
.badge-icon { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--ink3); font-size: 1.1rem; }
.badge-card.earned .badge-icon { background: var(--green); color: var(--ink); }
.badge-label { font-size: .76rem; font-weight: 600; line-height: 1.4; }

.dash-empty { text-align: center; padding: 60px 20px; color: var(--muted); }
.dash-empty a { color: var(--orange); font-weight: 600; }

@media (max-width: 720px) { .track-progress-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header class="header scrolled" id="header">
  <a href="index.html" class="logo"><span class="logo-name">Dev<span>Yoon</span></span></a>
  <nav class="nav">
    <a href="parcours-web.html">Parcours Web</a>
    <a href="parcours-ia.html">Parcours IA</a>
    <button class="btn-logout" onclick="handleLogout()">Se déconnecter</button>
  </nav>
</header>

<main class="dash-main" id="dash-main">
  <div class="dash-head">
    <div>
      <div class="dash-welcome">Ton tableau de bord</div>
      <div class="dash-email" id="user-email"></div>
    </div>
  </div>

  <div class="track-progress-grid">
    <div class="tp-card web">
      <div class="tp-head"><span class="tp-name">Web</span><span class="tp-count" id="web-count">0 / 8</span></div>
      <div class="tp-bar"><div class="tp-fill" id="web-fill" style="width:0%"></div></div>
      <div class="tp-phases" id="web-phases"></div>
      <a href="parcours-web.html" class="tp-link">Continuer le parcours →</a>
    </div>
    <div class="tp-card ia">
      <div class="tp-head"><span class="tp-name">IA</span><span class="tp-count" id="ia-count">0 / 7</span></div>
      <div class="tp-bar"><div class="tp-fill" id="ia-fill" style="width:0%"></div></div>
      <div class="tp-phases" id="ia-phases"></div>
      <a href="parcours-ia.html" class="tp-link">Continuer le parcours →</a>
    </div>
  </div>

  <div class="badges-title">Badges</div>
  <div class="badges-grid" id="badges-grid"></div>
</main>

<script>
async function handleLogout() {
  await devyoonSignOut();
  window.location.href = "login.html";
}

function renderPhases(containerId, total, doneIds) {
  const el = document.getElementById(containerId);
  el.innerHTML = "";
  for (let i = 0; i < total; i++) {
    const num = String(i).padStart(2, "0");
    const done = doneIds.includes(num);
    const chip = document.createElement("div");
    chip.className = "tp-phase-chip" + (done ? " done" : "");
    chip.textContent = done ? "✓" : num;
    el.appendChild(chip);
  }
}

function badgeIcon(type) {
  return type === "global" ? "🏆" : type === "track" ? "⭐" : "✓";
}

(async () => {
  const user = await devyoonRequireAuth("login.html");
  if (!user) return; // redirection en cours

  document.getElementById("user-email").textContent = user.email;

  const progress = await devyoonGetProgress();
  const totals = (window.DEVYOON_CONFIG && window.DEVYOON_CONFIG.TRACK_TOTALS) || { web: 8, ia: 7 };

  const webDoneIds = progress.web.map(r => r.phase_id.split("-")[1]);
  const iaDoneIds = progress.ia.map(r => r.phase_id.split("-")[1]);

  document.getElementById("web-count").textContent = `${webDoneIds.length} / ${totals.web}`;
  document.getElementById("web-fill").style.width = (webDoneIds.length / totals.web * 100) + "%";
  renderPhases("web-phases", totals.web, webDoneIds);

  document.getElementById("ia-count").textContent = `${iaDoneIds.length} / ${totals.ia}`;
  document.getElementById("ia-fill").style.width = (iaDoneIds.length / totals.ia * 100) + "%";
  renderPhases("ia-phases", totals.ia, iaDoneIds);

  const badges = devyoonComputeBadges(progress);
  const grid = document.getElementById("badges-grid");
  if (badges.filter(b => b.type !== "phase").length === 2 && webDoneIds.length === 0 && iaDoneIds.length === 0) {
    grid.innerHTML = `<div class="dash-empty" style="grid-column:1/-1;">Aucun badge pour l'instant — <a href="parcours-web.html">commence la Phase 00</a> pour débloquer ton premier badge.</div>`;
  } else {
    grid.innerHTML = badges.map(b => `
      <div class="badge-card ${b.earned ? "earned" : ""}">
        <div class="badge-icon">${badgeIcon(b.type)}</div>
        <div class="badge-label">${b.label}</div>
      </div>`).join("");
  }
})();
</script>

</body>
</html>
